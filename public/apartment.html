<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הדירה בתלת־ממד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e6eaec; --grid:rgba(36,58,82,.07); --grid-strong:rgba(36,58,82,.11);
  --ink:#1b2229; --muted:#5b6671; --rule:rgba(27,34,41,.16);
  --sheet:#f8fafb; --sheet-glass:rgba(248,250,251,.92);
  --pencil:#2b5cb0; --pencil-soft:rgba(43,92,176,.1); --on-pencil:#ffffff;
  --warn:#b8430f; --tag:rgba(248,250,251,.92);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101720; --grid:rgba(150,185,230,.06); --grid-strong:rgba(150,185,230,.1);
    --ink:#e3e9ef; --muted:#93a0ae; --rule:rgba(227,233,239,.16);
    --sheet:#17202a; --sheet-glass:rgba(23,32,42,.92);
    --pencil:#8cb3ff; --pencil-soft:rgba(140,179,255,.14); --on-pencil:#0d1520;
    --warn:#ff9f70; --tag:rgba(23,32,42,.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101720; --grid:rgba(150,185,230,.06); --grid-strong:rgba(150,185,230,.1);
  --ink:#e3e9ef; --muted:#93a0ae; --rule:rgba(227,233,239,.16);
  --sheet:#17202a; --sheet-glass:rgba(23,32,42,.92);
  --pencil:#8cb3ff; --pencil-soft:rgba(140,179,255,.14); --on-pencil:#0d1520;
  --warn:#ff9f70; --tag:rgba(23,32,42,.9); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Hebrew","Segoe UI","Arial Hebrew",Arial,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden;background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels.off{display:none}
.tag{position:absolute;left:0;top:0;padding:4px 9px 5px;background:var(--tag);border:1px solid var(--rule);
  border-radius:3px;white-space:nowrap;text-align:center;line-height:1.2;box-shadow:0 1px 0 var(--rule);transition:border-color .15s,box-shadow .15s}
.tag b{display:block;font-weight:600;font-size:13px}
.tag span{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;direction:rtl}
.tag.hot{border-color:var(--pencil);box-shadow:0 0 0 2px var(--pencil-soft)}
.tag.entry{background:var(--pencil);color:var(--on-pencil);border-color:transparent}

/* title block */
#panel{position:absolute;bottom:16px;right:16px;width:316px;max-height:calc(100% - 32px);
  display:flex;flex-direction:column;background:var(--sheet-glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
#panel > *{flex:none}
#panel > .tb-body{flex:1 1 auto;min-height:0;overflow:auto;padding:0 0 4px}
.tb-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--rule)}
.tb-head h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.005em;line-height:1.15}
.tb-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.icon-btn{margin-inline-start:auto;display:none;width:34px;height:34px;border-radius:2px;border:1px solid var(--rule);
  background:transparent;color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.seg button{font:inherit;font-size:14px;font-weight:500;padding:10px 6px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--pencil);color:var(--on-pencil)}
.seg button:not([aria-pressed="true"]):hover{background:var(--pencil-soft)}
.edit-row{padding:10px 16px;border-bottom:1px solid var(--rule)}
.edit-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:14px;font-weight:500;
  padding:8px 12px;border:1.5px solid var(--ink);border-radius:2px;background:transparent;color:var(--ink);cursor:pointer}
.edit-btn svg{width:16px;height:16px;flex:none}
.edit-btn[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.edit-btn:not([aria-pressed="true"]):hover{background:var(--pencil-soft)}
.cell{padding:12px 16px;border-bottom:1px solid var(--rule)}
.cell:last-child{border-bottom:0}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted)}
.row output{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--pencil)}
input[type=range]:disabled{opacity:.45}
.toggles{display:flex;gap:18px}
.tog{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--pencil);margin:0}
#roomList{list-style:none;margin:0;padding:0}
#roomList button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font:inherit;font-size:14px;text-align:start;padding:7px 8px;margin:0 -8px;width:calc(100% + 16px);
  border:0;border-radius:2px;background:transparent;color:var(--ink);cursor:pointer}
#roomList small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;direction:ltr}
#roomList button.hot{background:var(--pencil-soft)}
.note{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
button:focus-visible,input:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}

/* selected piece */
#inspector{padding:12px 16px 14px;border-bottom:1px solid var(--rule);background:var(--pencil-soft)}
.ins-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.ins-head h2{margin:0;font-size:16px;font-weight:600;line-height:1.25}
.warn{margin:2px 0 0;font-size:12.5px;line-height:1.35;color:var(--warn)}
.ins-close{margin-inline-start:auto;flex:none;display:grid;place-items:center;width:30px;height:30px;padding:0;
  border:1px solid var(--rule);border-radius:2px;background:var(--sheet);color:var(--ink);cursor:pointer}
.ins-close svg{width:14px;height:14px}
.dim{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;margin-top:6px}
.dim label{font-size:13.5px;color:var(--muted)}
.dim input[type=range]{margin:0}
.num{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
.num input{width:56px;font:inherit;font-size:14px;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);
  border-radius:2px;padding:4px;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield}
.num input::-webkit-inner-spin-button,.num input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.rot{direction:ltr;display:flex;align-items:center;gap:6px;margin-top:12px}
.rot button,.ins-actions button,.actions button{font:inherit;font-size:13px;color:var(--ink);background:var(--sheet);
  border:1px solid var(--rule);border-radius:2px;cursor:pointer}
.rot button{display:flex;align-items:center;gap:3px;padding:6px 7px;font-variant-numeric:tabular-nums}
.rot svg,.actions svg{width:15px;height:15px;flex:none}
.rot output{flex:1;text-align:center;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.ins-actions{display:flex;gap:8px;margin-top:10px}
.ins-actions button{flex:1;padding:8px;font-weight:500}
.ins-actions .danger{color:var(--warn)}
.rot button:hover,.ins-actions button:hover,.actions button:not(:disabled):hover{border-color:var(--pencil)}

/* catalog */
.sub{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--muted)}
.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;padding:8px 4px 7px;font:inherit;font-size:12.5px;
  line-height:1.2;text-align:center;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:2px;cursor:pointer}
.cat svg{width:30px;height:30px;flex:none;color:var(--pencil)}
.cat:hover{border-color:var(--pencil);background:var(--pencil-soft)}
.actions .pair{display:flex;gap:8px}
.actions .pair + .pair{margin-top:8px}
.actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px}
.actions button:disabled{opacity:.45;cursor:default}

#hint{position:absolute;bottom:18px;left:18px;max-width:min(520px,calc(100% - 370px));font-size:12.5px;color:var(--muted);
  background:var(--sheet-glass);border:1px solid var(--rule);border-radius:2px;padding:6px 10px;pointer-events:none}
#toast{position:absolute;left:18px;bottom:60px;display:flex;align-items:center;gap:14px;padding:7px 8px;padding-inline-start:14px;
  font-size:13.5px;background:var(--ink);color:var(--sheet);border-radius:2px}
#toast button{font:inherit;font-size:13.5px;font-weight:600;padding:4px 8px;border:0;border-radius:2px;background:transparent;
  color:var(--sheet);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#joystick{position:absolute;left:28px;bottom:28px;width:118px;height:118px;border-radius:50%;
  border:1.5px solid var(--ink);background:var(--sheet-glass);display:none;touch-action:none;cursor:grab}
#joystick span{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--pencil);pointer-events:none}
#exitWalk{position:absolute;top:16px;left:16px;display:none;font:inherit;font-size:14px;font-weight:500;padding:9px 14px;
  border:1.5px solid var(--ink);border-radius:2px;background:var(--sheet);color:var(--ink);cursor:pointer}
body.walking #joystick,body.walking #exitWalk{display:block}
body.walking #hint{bottom:auto;top:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 200px)}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--muted);text-align:center;padding:24px}
#loading.error{color:var(--ink)}

@media (max-width:720px){
  #panel{left:10px;right:10px;bottom:10px;width:auto;max-height:62%}
  .icon-btn{display:block}
  .tb-head{padding:10px 12px}
  .tb-head h1{font-size:18px}
  .tb-head p{display:none}
  .edit-row{padding:8px 12px}
  #panel > .tb-body{display:none}
  #panel.open > .tb-body{display:block}
  .catalog{grid-template-columns:repeat(4,minmax(0,1fr))}
  body.selecting #panel > :not(#inspector){display:none}
  #inspector{border-bottom:0}
  #hint{display:none}
  body.walking #hint{display:block;top:62px;left:50%;max-width:calc(100% - 24px);text-align:center}
  body.walking #panel{display:none}
  body.editing:not(.selecting):not(.walking) #hint{display:block;top:12px;bottom:auto;left:12px;right:12px;max-width:none;text-align:center}
  #toast{left:12px;right:12px;bottom:auto;top:12px;justify-content:space-between}
  #exitWalk{top:12px;left:12px}
  #joystick{left:22px;bottom:26px}
  .tag{padding:3px 7px}
  .tag b{font-size:12px}
  .tag span{display:none}
}
@media (prefers-reduced-motion: reduce){ .tag{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>
  <div id="loading">בונה את המודל…</div>

  <aside id="panel" aria-label="אפשרויות תצוגה ועריכה">
    <div class="tb-head">
      <div>
        <h1>הדירה בתלת־ממד</h1>
        <p>3 חדרים, מרפסת ו־2 חדרי רחצה</p>
      </div>
      <button id="collapse" class="icon-btn" type="button" aria-expanded="false" aria-controls="tbBody" aria-label="הצגת אפשרויות">☰</button>
    </div>
    <div class="seg" role="group" aria-label="סוג תצוגה">
      <button type="button" data-view="iso" aria-pressed="true">תלת־ממד</button>
      <button type="button" data-view="top" aria-pressed="false">מבט על</button>
      <button type="button" data-view="walk" aria-pressed="false">סיור בדירה</button>
    </div>
    <div class="edit-row">
      <button id="editToggle" class="edit-btn" type="button" aria-pressed="false">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M3.5 16.5l1-4.2 9-9 3.2 3.2-9 9z"/><path d="M11.8 5l3.2 3.2"/></svg>
        <span id="editLabel">עריכת ריהוט</span>
      </button>
    </div>

    <section id="inspector" aria-label="הרהיט שנבחר" hidden>
      <div class="ins-head">
        <div>
          <h2 id="insName"></h2>
          <p id="insWarn" class="warn" role="status" hidden></p>
        </div>
        <button id="insClose" class="ins-close" type="button" aria-label="ביטול הבחירה">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg>
        </button>
      </div>
      <div class="dim" id="rowW"><label for="dimW">רוחב</label><input id="dimW" type="range" step="1"><span class="num"><input id="dimWn" type="number" step="1" inputmode="numeric" dir="ltr"> ס״מ</span></div>
      <div class="dim" id="rowD"><label for="dimD">עומק</label><input id="dimD" type="range" step="1"><span class="num"><input id="dimDn" type="number" step="1" inputmode="numeric" dir="ltr"> ס״מ</span></div>
      <div class="dim" id="rowH"><label for="dimH">גובה</label><input id="dimH" type="range" step="1"><span class="num"><input id="dimHn" type="number" step="1" inputmode="numeric" dir="ltr"> ס״מ</span></div>
      <div class="rot" role="group" aria-label="סיבוב">
        <button type="button" data-rot="90" aria-label="סיבוב ב־90 מעלות נגד כיוון השעון"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10a5.5 5.5 0 1 0 1.6-3.9"/><path d="M5.5 3.4v3.3h3.3"/></svg>90°</button>
        <button type="button" data-rot="15" aria-label="סיבוב ב־15 מעלות נגד כיוון השעון"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10a5.5 5.5 0 1 0 1.6-3.9"/><path d="M5.5 3.4v3.3h3.3"/></svg>15°</button>
        <output id="insAngle" aria-label="זווית"></output>
        <button type="button" data-rot="-15" aria-label="סיבוב ב־15 מעלות עם כיוון השעון">15°<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="matrix(-1 0 0 1 20 0)"><path d="M4.5 10a5.5 5.5 0 1 0 1.6-3.9"/><path d="M5.5 3.4v3.3h3.3"/></g></svg></button>
        <button type="button" data-rot="-90" aria-label="סיבוב ב־90 מעלות עם כיוון השעון">90°<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="matrix(-1 0 0 1 20 0)"><path d="M4.5 10a5.5 5.5 0 1 0 1.6-3.9"/><path d="M5.5 3.4v3.3h3.3"/></g></svg></button>
      </div>
      <div class="ins-actions">
        <button id="insDup" type="button">שכפול</button>
        <button id="insDel" type="button" class="danger">מחיקה</button>
      </div>
    </section>

    <div class="tb-body" id="tbBody">
      <div class="cell">
        <label class="row" for="cut">גובה הקירות <output id="cutOut"></output></label>
        <input id="cut" type="range" min="0.9" max="2.7" step="0.05" value="1.4">
      </div>
      <div id="viewBody">
        <div class="cell toggles">
          <label class="tog"><input id="tFurn" type="checkbox" checked><span>ריהוט</span></label>
          <label class="tog"><input id="tLabels" type="checkbox" checked><span>שמות ומידות</span></label>
        </div>
        <div class="cell">
          <ul id="roomList"></ul>
        </div>
        <div class="cell">
          <p class="note">מידות החדרים לקוחות מהתוכנית. גובה התקרה (2.70 מ׳) ומיקום החלונות הם הערכה.</p>
        </div>
      </div>
      <div id="editBody" hidden>
        <div class="cell">
          <h3 class="sub">הוספת רהיט</h3>
          <div id="catalog" class="catalog"></div>
        </div>
        <div class="cell actions">
          <div class="pair">
            <button id="undoBtn" type="button" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 5.5L16 9l-3.5 3.5"/><path d="M15.5 9H8a4 4 0 0 0 0 8h2"/></svg>ביטול</button>
            <button id="redoBtn" type="button" disabled><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 5.5L4 9l3.5 3.5"/><path d="M4.5 9H12a4 4 0 0 1 0 8h-2"/></svg>ביצוע מחדש</button>
          </div>
          <div class="pair">
            <button id="resetBtn" type="button">חזרה לסידור המקורי</button>
            <button id="clearBtn" type="button">הסרת כל הריהוט</button>
          </div>
        </div>
        <div class="cell">
          <p class="note" id="saveNote"></p>
        </div>
      </div>
    </div>
  </aside>

  <div id="hint"></div>
  <div id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button id="toastUndo" type="button">ביטול</button></div>
  <div id="joystick" aria-hidden="true"><span></span></div>
  <button id="exitWalk" type="button">יציאה מהסיור</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
'use strict';
const loadingEl = document.getElementById('loading');
function fail(msg){ loadingEl.textContent = msg; loadingEl.classList.add('error'); }

  const T = TYPES[c.type];
  const it = { id: newId(), type: c.type, w: c.w, d: T.square ? c.w : c.d, rot: 0 };
  if (T.h) it.h = c.h;
  if (c.duvet) it.duvet = c.duvet;
  const [X0, Y0] = spawnPoint(), [X, Y] = freeSpot(it, X0, Y0);
  it.x = Math.round(clampR(X, [BOUNDS[0], BOUNDS[2]]));
  it.y = Math.round(clampR(Y, [BOUNDS[1], BOUNDS[3]]));
  items.push(it); sync(); select(it.id); scheduleSave();
  if (isMobile()) closeSheet();
}
const catalogEl = $('catalog');
for (const c of CATALOG) {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'cat';
  b.innerHTML = svgIcon(ICONS[c.icon]) + '<span></span>';
  b.lastChild.textContent = c.label;
  b.title = c.label + ', ' + c.w + '×' + c.d + ' ס״מ';
  b.addEventListener('click', () => addFromCatalog(c));
  catalogEl.appendChild(b);
}
$('resetBtn').addEventListener('click', () => {
  checkpoint(); items = JSON.parse(JSON.stringify(DEFAULTS)); sync(); select(null); scheduleSave();
  toast('הסידור המקורי שוחזר', true);
});
$('clearBtn').addEventListener('click', () => {
  if (!items.length) return;
  checkpoint(); items = []; sync(); select(null); scheduleSave();
  toast('כל הריהוט הוסר', true);
});

/* ---------- toast ---------- */
const toastEl = $('toast'), toastMsg = $('toastMsg'), toastUndo = $('toastUndo');
let toastTimer = 0;
function toast(msg, canUndo){
  toastMsg.textContent = msg; toastUndo.hidden = !canUndo; toastEl.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 5000);
}
toastUndo.addEventListener('click', () => { undo(); toastEl.hidden = true; });

/* ---------- edit mode ---------- */
const editToggle = $('editToggle'), editLabel = $('editLabel'), viewBody = $('viewBody'), editBody = $('editBody');
const isMobile = () => matchMedia('(max-width:720px)').matches;
function openSheet(){ panel.classList.add('open'); collapseBtn.setAttribute('aria-expanded', 'true'); }
function closeSheet(){ panel.classList.remove('open'); collapseBtn.setAttribute('aria-expanded', 'false'); }
function setEditing(on){
  if (on === editing) return;
  if (on && mode === 'walk') setMode('iso');
  editing = on;
  document.body.classList.toggle('editing', on);
  editToggle.setAttribute('aria-pressed', String(on));
  editLabel.textContent = on ? 'סיום עריכה' : 'עריכת ריהוט';
  viewBody.hidden = on; editBody.hidden = !on;
  if (on) {
    if (!tFurn.checked) { tFurn.checked = true; layers.furn.visible = layers.items.visible = true; reshadow(); }
    highlight(null);
    if (isMobile()) openSheet();
    if (dbState === 'pending') connectDb();
  } else {
    if (dragging) { dragging = null; controls.enabled = true; }
    select(null); canvas.style.cursor = '';
    if (isMobile()) closeSheet();
  }
  setHint(); invalidate();
}
editToggle.addEventListener('click', () => setEditing(!editing));
addEventListener('keydown', e => {
  if (!editing || mode === 'walk') return;
  const t = e.target, typing = !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.code === 'KeyZ' && !(typing && t.type === 'number')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod && e.code === 'KeyY' && !typing) { e.preventDefault(); redo(); return; }
  if (typing) return;
  if (e.key === 'Escape') { if (selectedId) select(null); return; }
  if (!selectedId) return;
  if (mod && e.code === 'KeyD') { e.preventDefault(); duplicate(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSelected(); return; }
  if (e.code === 'KeyR' && !mod) { e.preventDefault(); rotateBy(e.shiftKey ? 90 : -90); return; }
  const dir = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
  if (dir) { e.preventDefault(); nudge(dir[0], dir[1], e.shiftKey ? 10 : 1); }
});

/* ---------- saving: the viewer's account when available, this browser otherwise ---------- */
const LS_KEY = 'apartment-3d:furniture:v1';
const saveNote = $('saveNote');
let dbRef = null, dbState = 'off', writing = false, pendingWrite = false, saveTimer = 0;
function setSaveNote(kind){
  saveNote.textContent = kind === 'db' ? 'השינויים נשמרים אוטומטית בחשבון שלך.'
    : kind === 'local' ? 'השינויים נשמרים אוטומטית בדפדפן הזה.'
    : 'אי אפשר לשמור כאן, ולכן השינויים יימחקו כשתסגרו את הדף.';
}
function readLocal(){
  try { const s = localStorage.getItem(LS_KEY); if (!s) return null; const o = JSON.parse(s); return normalize(o && o.items); } catch (_) { return null; }
}
function writeLocal(){
  try { localStorage.setItem(LS_KEY, JSON.stringify({ v: 1, items })); return true; } catch (_) { return false; }
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 500); }
function saveNow(){
  const ok = writeLocal();
  if (dbRef) writeDb();
  else if (dbState !== 'connecting') setSaveNote(ok ? 'local' : 'none');
}
async function writeDb(){
  if (writing) { pendingWrite = true; return; }
  writing = true;
  const body = () => ({ v: 1, items: JSON.parse(JSON.stringify(items)) });
  try { await dbRef.set(body()); setSaveNote('db'); }
  catch (err) {
    let ok = false;
    if (err && err.code === 'unavailable') {
      await new Promise(r => setTimeout(r, 800 + Math.random() * 1200));
      try { await dbRef.set(body()); ok = true; setSaveNote('db'); } catch (_) {}
    }
    if (!ok) { dbRef = null; dbState = 'off'; setSaveNote(localOK ? 'local' : 'none'); }
  }
  writing = false;
  if (pendingWrite && dbRef) { pendingWrite = false; writeDb(); }
}
async function initDb(){
  const C = window.claude;
  if (!C || typeof C.use !== 'function') return;
  try {
    const perms = await C.use('permissions');
    const st = perms ? await perms.state('db') : 'prompt';
    if (st === 'granted') connectDb();
    else if (st === 'prompt') { dbState = 'pending'; if (editing) connectDb(); }
  } catch (_) {}
}
async function connectDb(){
  if (dbState === 'connecting' || dbState === 'on') return;
  dbState = 'connecting';
  try {
    const C = window.claude;
    const [db, user] = await Promise.all([C.use('db'), C.use('user')]);
    const uid = db && user ? await user.id() : null;
    if (!uid) { dbState = 'off'; return; }
    const ref = db.doc('data/users/' + uid + '/furniture');
    const snap = await ref.get();
    dbRef = ref; dbState = 'on'; setSaveNote('db');
    const remote = snap.exists ? normalize((snap.data() || {}).items) : null;
    if (remote && !touched) {
      if (JSON.stringify(remote) !== JSON.stringify(items)) {
        items = remote; undoStack.length = 0; redoStack.length = 0;
        sync(); select(getItem(selectedId) ? selectedId : null); updateHistoryButtons(); writeLocal();
      }
    } else if (touched) writeDb();
  } catch (_) {
    dbRef = null; dbState = 'off';
  }
}

/* ---------- start ---------- */
const localOK = (() => { try { const k = LS_KEY + ':probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (_) { return false; } })();
items = (localOK && readLocal()) || JSON.parse(JSON.stringify(DEFAULTS));
sync();
setSaveNote(localOK ? 'local' : 'none');
updateHistoryButtons();
initDb();

loadingEl.remove();
requestAnimationFrame(frameLoop);
})();

</script>
