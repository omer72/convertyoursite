<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הדירה בתלת־ממד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#e6eaec; --grid:rgba(36,58,82,.07); --grid-strong:rgba(36,58,82,.11);
  --ink:#1b2229; --muted:#5b6671; --rule:rgba(27,34,41,.16);
  --sheet:#f8fafb; --sheet-glass:rgba(248,250,251,.9);
  --pencil:#2b5cb0; --pencil-soft:rgba(43,92,176,.12); --on-pencil:#ffffff;
  --tag:rgba(248,250,251,.92);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101720; --grid:rgba(150,185,230,.06); --grid-strong:rgba(150,185,230,.1);
    --ink:#e3e9ef; --muted:#93a0ae; --rule:rgba(227,233,239,.16);
    --sheet:#17202a; --sheet-glass:rgba(23,32,42,.9);
    --pencil:#8cb3ff; --pencil-soft:rgba(140,179,255,.16); --on-pencil:#0d1520;
    --tag:rgba(23,32,42,.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101720; --grid:rgba(150,185,230,.06); --grid-strong:rgba(150,185,230,.1);
  --ink:#e3e9ef; --muted:#93a0ae; --rule:rgba(227,233,239,.16);
  --sheet:#17202a; --sheet-glass:rgba(23,32,42,.9);
  --pencil:#8cb3ff; --pencil-soft:rgba(140,179,255,.16); --on-pencil:#0d1520;
  --tag:rgba(23,32,42,.9); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans Hebrew","Segoe UI","Arial Hebrew",Arial,sans-serif;font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden}
#app{position:relative;width:100%;height:100%;overflow:hidden;
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels.off{display:none}
.tag{position:absolute;left:0;top:0;padding:4px 9px 5px;background:var(--tag);border:1px solid var(--rule);
  border-radius:3px;white-space:nowrap;text-align:center;line-height:1.2;
  box-shadow:0 1px 0 var(--rule);transition:border-color .15s,box-shadow .15s}
.tag b{display:block;font-weight:600;font-size:13px}
.tag span{display:block;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;direction:rtl}
.tag.hot{border-color:var(--pencil);box-shadow:0 0 0 2px var(--pencil-soft)}
.tag.entry{background:var(--pencil);color:var(--on-pencil);border-color:transparent}

/* title block */
#panel{position:absolute;bottom:16px;right:16px;width:316px;max-height:calc(100% - 32px);
  display:flex;flex-direction:column;background:var(--sheet-glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1.5px solid var(--ink);border-radius:2px;overflow:hidden}
.tb-head{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 12px;border-bottom:1px solid var(--rule)}
.tb-head h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.005em;line-height:1.15}
.tb-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.icon-btn{margin-inline-start:auto;display:none;width:34px;height:34px;border-radius:2px;border:1px solid var(--rule);
  background:transparent;color:var(--ink);font:inherit;font-size:16px;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--rule)}
.seg button{font:inherit;font-size:14px;font-weight:500;padding:10px 6px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--pencil);color:var(--on-pencil)}
.seg button:not([aria-pressed="true"]):hover{background:var(--pencil-soft)}
.tb-body{overflow:auto;padding:0 0 4px}
.cell{padding:12px 16px;border-bottom:1px solid var(--rule)}
.cell:last-child{border-bottom:0}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted)}
.row output{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:10px 0 2px;accent-color:var(--pencil)}
input[type=range]:disabled{opacity:.45}
.toggles{display:flex;gap:18px}
.tog{display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.tog input{width:16px;height:16px;accent-color:var(--pencil);margin:0}
#roomList{list-style:none;margin:0;padding:0}
#roomList button{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font:inherit;font-size:14px;text-align:start;padding:7px 8px;margin:0 -8px;width:calc(100% + 16px);
  border:0;border-radius:2px;background:transparent;color:var(--ink);cursor:pointer}
#roomList small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;direction:ltr}
#roomList button.hot{background:var(--pencil-soft)}
.note{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
button:focus-visible,input:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}

#hint{position:absolute;bottom:18px;left:18px;max-width:min(520px,calc(100% - 370px));font-size:12.5px;color:var(--muted);
  background:var(--sheet-glass);border:1px solid var(--rule);border-radius:2px;padding:6px 10px;pointer-events:none}
#joystick{position:absolute;left:28px;bottom:28px;width:118px;height:118px;border-radius:50%;
  border:1.5px solid var(--ink);background:var(--sheet-glass);display:none;touch-action:none;cursor:grab}
#joystick span{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--pencil);pointer-events:none}
#exitWalk{position:absolute;top:16px;left:16px;display:none;font:inherit;font-size:14px;font-weight:500;padding:9px 14px;
  border:1.5px solid var(--ink);border-radius:2px;background:var(--sheet);color:var(--ink);cursor:pointer}
body.walking #joystick,body.walking #exitWalk{display:block}
body.walking #hint{bottom:auto;top:16px;left:50%;transform:translateX(-50%);max-width:calc(100% - 200px)}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;color:var(--muted);text-align:center;padding:24px}
#loading.error{color:var(--ink)}

@media (max-width:720px){
  #panel{left:10px;right:10px;bottom:10px;width:auto;max-height:62%}
  .icon-btn{display:block}
  .tb-head{padding:10px 12px}
  .tb-head h1{font-size:18px}
  .tb-body{display:none}
  #panel.open .tb-body{display:block}
  #hint{display:none}
  body.walking #hint{display:block;top:62px;left:50%;max-width:calc(100% - 24px);text-align:center}
  body.walking #panel{display:none}
  #exitWalk{top:12px;left:12px}
  #joystick{left:22px;bottom:26px}
}
@media (max-width:720px){
  .tag{padding:3px 7px}
  .tag b{font-size:12px}
  .tag span{display:none}
}
@media (prefers-reduced-motion: reduce){ .tag{transition:none} }
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>
  <div id="loading">בונה את המודל…</div>

  <aside id="panel" aria-label="אפשרויות תצוגה">
    <div class="tb-head">
      <div>
        <h1>הדירה בתלת־ממד</h1>
        <p>3 חדרים, מרפסת ו־2 חדרי רחצה</p>
      </div>
      <button id="collapse" class="icon-btn" type="button" aria-expanded="false" aria-controls="tbBody" aria-label="הצגת אפשרויות">☰</button>
    </div>
    <div class="seg" role="group" aria-label="סוג תצוגה">
      <button type="button" data-view="iso" aria-pressed="true">תלת־ממד</button>
      <button type="button" data-view="top" aria-pressed="false">מבט על</button>
      <button type="button" data-view="walk" aria-pressed="false">סיור בדירה</button>

    <div class="tb-body" id="tbBody">
      <div class="cell">
        <label class="row" for="cut">גובה הקירות <output id="cutOut"></output></label>
        <input id="cut" type="range" min="0.9" max="2.7" step="0.05" value="1.4">
      </div>
      <div class="cell toggles">
        <label class="tog"><input id="tFurn" type="checkbox" checked><span>ריהוט</span></label>
        <label class="tog"><input id="tLabels" type="checkbox" checked><span>שמות ומידות</span></label>
      </div>
      <div class="cell">
        <ul id="roomList"></ul>
      </div>
      <div class="cell">
        <p class="note">מידות החדרים לקוחות מהתוכנית. גובה התקרה (2.70 מ׳), מיקום החלונות והריהוט הם הערכה.</p>
      </div>
    </div>
  </aside>

  <div id="hint"></div>
  <div id="joystick" aria-hidden="true"><span></span></div>
  <button id="exitWalk" type="button">יציאה מהסיור</button>
</div>

const wx = X => (X - CX) * S, wz = Y => (Y - CY) * S;

const CLIP = [cutPlane];

/* ---------- random + textures ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

    const s = px / n;

    }
  });
}
function deckTex(seed){
  const r = rng(seed), col = new THREE.Color();
  return canvasTex(512, (g, px) => {

/* ---------- build ---------- */
buildWalls(); buildFloors(); buildFurniture(); buildBalcony(); finalize();
layers.ceiling.visible = false;
let dirty = true, labelSizes = false;

/* ---------- light & environment ---------- */
(function env(){
  const pm = new THREE.PMREMGenerator(renderer), es = new THREE.Scene();

  lamp(10, 6, 0, 8.9, 0, 0xffffff); lamp(6, 4, -9.5, 4, 3, 0xfff1dd); lamp(6, 4, 9.5, 4, -3, 0xdfe9ff);
  scene.environment = pm.fromScene(es, 0.04).texture;
})();
scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b2a6, 0.35));
const sun = new THREE.DirectionalLight(0xfff3e2, 2.1);

Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 });

let mode = 'iso';
/* ---------- camera & controls ---------- */
const stage = document.getElementById('stage');
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.08, screenSpacePanning: true, minDistance: 2.5, maxDistance: 40, maxPolarAngle: 1.48 });
const RADIUS = 7.6;
function fitDistance(){
  const w = stage.clientWidth, h = Math.max(stage.clientHeight, 1), free = w > 720 ? (w - 340) / h : camera.aspect;
  const vf = THREE.MathUtils.degToRad(camera.fov) / 2, hf = Math.atan(Math.tan(vf) * free);

}
function viewPose(kind){

  if (kind === 'top') return { pos: new THREE.Vector3(0, D * 1.02, 0.001), tgt: new THREE.Vector3(0, 0, 0) };
  const az = THREE.MathUtils.degToRad(28), pol = THREE.MathUtils.degToRad(50);
  return { pos: new THREE.Vector3(Math.sin(pol) * Math.sin(az), Math.cos(pol), Math.sin(pol) * Math.cos(az)).multiplyScalar(D).add(new THREE.Vector3(0, 0, 0.3)), tgt: new THREE.Vector3(0, 0, 0.3) };
}
let tween = null;
function flyTo(pose, ms = 900){

  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pose.pos, t1: pose.tgt, start: performance.now(), ms };
}
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;

  const side = mode !== 'walk' && w > 720 ? Math.min(170, (document.getElementById('panel').offsetWidth + 16) / 2) : 0;
  const lift = mode !== 'walk' && w <= 720 ? 40 : 0;

}
resize(); addEventListener('resize', resize);
{ const p = viewPose('iso'); camera.position.copy(p.pos).multiplyScalar(1.25); controls.target.copy(p.tgt); controls.update(); flyTo(p, 1400); }

/* ---------- cut height ---------- */
const cutInput = document.getElementById('cut'), cutOut = document.getElementById('cutOut');
let cutH = 1.4;
function setCut(m){

}
cutInput.addEventListener('input', () => setCut(parseFloat(cutInput.value)));
setCut(1.4);

/* ---------- labels ---------- */
const labelsEl = document.getElementById('labels'), labels = [];
function roomOf(X, Y){ return PLAN.rooms.find(r => r.rects.some(q => X >= q[0] && X <= q[2] && Y >= q[1] && Y <= q[3])); }
for (const r of PLAN.rooms) {
  const el = document.createElement('div'); el.className = 'tag'; el.dataset.room = r.id;
  el.innerHTML = '<b></b><span></span>'; el.firstChild.textContent = r.name;
  el.lastChild.innerHTML = (r.dims.includes('×') ? '' : 'רוחב ') + '<bdi dir="ltr"></bdi> מ׳'; el.lastChild.querySelector('bdi').textContent = r.dims;
  labelsEl.appendChild(el);
  labels.push({ id: r.id, el, v: new THREE.Vector3(wx(r.label[0]), 0.05, wz(r.label[1])) });
}
{ const el = document.createElement('div'); el.className = 'tag entry'; el.innerHTML = '<b>כניסה</b>'; labelsEl.appendChild(el); labels.push({ id: 'entry', el, v: new THREE.Vector3(wx(303), 0.02, wz(655)) }); }
const PRI = ['living', 'master', 'mamad', 'kitchen', 'balcony', 'entry', 'bath1', 'bath2', 'hall'];
labels.sort((a, b) => PRI.indexOf(a.id) - PRI.indexOf(b.id));
const tmp = new THREE.Vector3();
function measureLabels(){
  for (const L of labels) { L.w = L.el.offsetWidth; L.h = L.el.offsetHeight; }
  labelSizes = labels.every(L => L.w > 0);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { labelSizes = false; invalidate(); });
function placeLabels(){
  if (!labelSizes) measureLabels();
  const w = stage.clientWidth, h = stage.clientHeight, boxes = [];
  for (const L of labels) {
    tmp.copy(L.v).project(camera);
    let on = tmp.z < 1 && Math.abs(tmp.x) < 1.2 && Math.abs(tmp.y) < 1.2;
    const x = (tmp.x + 1) / 2 * w, y = (1 - tmp.y) / 2 * h;
    if (on) {
      const b = [x - L.w / 2 - 3, y - L.h / 2 - 3, x + L.w / 2 + 3, y + L.h / 2 + 3];
      if (boxes.some(q => b[0] < q[2] && b[2] > q[0] && b[1] < q[3] && b[3] > q[1])) on = false;
      else boxes.push(b);
    }
    L.el.style.visibility = on ? '' : 'hidden';
    if (on) L.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -50%)`;
  }
}

/* ---------- room list, hover, focus ---------- */
const list = document.getElementById('roomList');
for (const r of PLAN.rooms) {
  const li = document.createElement('li'), b = document.createElement('button');
  b.type = 'button'; b.dataset.room = r.id;
  b.innerHTML = '<span></span><small></small>'; b.firstChild.textContent = r.name; b.lastChild.textContent = r.dims;
  b.addEventListener('click', () => focusRoom(r.id));
  b.addEventListener('mouseenter', () => highlight(r.id)); b.addEventListener('mouseleave', () => highlight(null));
  b.addEventListener('focus', () => highlight(r.id)); b.addEventListener('blur', () => highlight(null));
  li.appendChild(b); list.appendChild(li);
}
let hot = null;
const hotColor = new THREE.Color(0x3a6fd8);
function highlight(id){
  if (hot === id) return; hot = id;
  for (const k in roomMeshes) roomMeshes[k].material.emissive.copy(k === id ? hotColor : new THREE.Color(0)).multiplyScalar(k === id ? 0.22 : 0);
  document.querySelectorAll('[data-room]').forEach(el => el.classList.toggle('hot', el.dataset.room === id));
  invalidate();
}
function focusRoom(id){
  if (mode === 'walk') setMode('iso');
  const r = PLAN.rooms.find(q => q.id === id);
  let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
  r.rects.forEach(q => { x1 = Math.min(x1, q[0]); y1 = Math.min(y1, q[1]); x2 = Math.max(x2, q[2]); y2 = Math.max(y2, q[3]); });
  const c = new THREE.Vector3(wx((x1 + x2) / 2), 0.4, wz((y1 + y2) / 2));
  const size = Math.max(x2 - x1, y2 - y1) * S;
  const dir = camera.position.clone().sub(controls.target); dir.y = 0;
  if (dir.lengthSq() < 1e-4) dir.set(0.35, 0, 1);
  dir.normalize();
  const D = size * 1.7 + 3.2, pol = THREE.MathUtils.degToRad(48);
  flyTo({ pos: c.clone().add(dir.multiplyScalar(Math.sin(pol) * D)).add(new THREE.Vector3(0, Math.cos(pol) * D, 0)), tgt: c });
  setSeg('iso');
}
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pick(ev){
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set((ev.clientX - rect.left) / rect.width * 2 - 1, -(ev.clientY - rect.top) / rect.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects([layers.floors, layers.structure, layers.furn], true).find(h => h.object.material !== M.cap && h.object.parent.visible && (!h.object.material.clippingPlanes || h.point.y <= cutH + 0.01));
  if (!hit) return null;
  const room = roomOf(hit.point.x / S + CX, hit.point.z / S + CY);
  return room ? room.id : null;
}
let down = null, hoverQueued = false, lastMove = null;
renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (mode === 'walk' || !down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t; down = null;
  if (moved < 6 && dt < 450) { const id = pick(e); if (id) focusRoom(id); }
});
renderer.domElement.addEventListener('pointermove', e => {
  if (mode === 'walk' || e.pointerType !== 'mouse') return;
  lastMove = e;
  if (!hoverQueued) { hoverQueued = true; requestAnimationFrame(() => { hoverQueued = false; if (lastMove && !down) highlight(pick(lastMove)); }); }
});
renderer.domElement.addEventListener('pointerleave', () => highlight(null));

/* ---------- toggles ---------- */
const tFurn = document.getElementById('tFurn'), tLabels = document.getElementById('tLabels');
tFurn.addEventListener('change', () => { layers.furn.visible = tFurn.checked; layers.ceilingItems.visible = tFurn.checked && cutH >= H * S - 0.001; reshadow(); });
tLabels.addEventListener('change', () => { labelsEl.hidden = !tLabels.checked; layers.annot.visible = tLabels.checked; invalidate(); });

/* ---------- modes ---------- */
const seg = document.querySelectorAll('[data-view]');
function setSeg(m){ seg.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === m))); }
seg.forEach(b => b.addEventListener('click', () => setMode(b.dataset.view)));
document.getElementById('exitWalk').addEventListener('click', () => setMode('iso'));
const hint = document.getElementById('hint');
const coarse = matchMedia('(pointer: coarse)').matches;
function setHint(){
  hint.textContent = mode === 'walk'
    ? (coarse ? 'גררו כדי להסתכל סביב, והזיזו את הג׳ויסטיק כדי ללכת' : 'גררו כדי להסתכל סביב. W/S או החיצים להליכה, A/D לצעד הצידה, Esc ליציאה')
    : (coarse ? 'גררו לסיבוב, צבטו לזום, שתי אצבעות להזזה. הקשה על חדר מקרבת אליו' : 'גררו לסיבוב, גלגלת לזום, קליק ימני להזזה. קליק על חדר מקרב אליו');
}
const walk = { yaw: 0, pitch: -0.08, pos: new THREE.Vector3(), keys: {}, joy: { x: 0, y: 0 }, saved: null, savedCut: H * S };
function setMode(m){
  if (m === mode && m !== 'top' && m !== 'iso') return;
  const fromWalk = mode === 'walk';
  if (fromWalk && m !== 'walk') {
    document.body.classList.remove('walking');
    layers.ceiling.visible = false; controls.enabled = true;
    camera.position.copy(walk.saved.pos); controls.target.copy(walk.saved.tgt); controls.update();
    cutInput.value = walk.savedCut; setCut(walk.savedCut); cutInput.disabled = false;
    labelsEl.classList.remove('off');
  }
  mode = m; setSeg(m); setHint(); resize();
  if (m === 'walk') {
    tween = null;
    walk.saved = { pos: camera.position.clone(), tgt: controls.target.clone() };
    walk.savedCut = cutH; cutInput.value = H * S; setCut(H * S); cutInput.disabled = true;
    controls.enabled = false; layers.ceiling.visible = true; document.body.classList.add('walking');
    labelsEl.classList.add('off');
    walk.pos.set(wx(300), 1.6, wz(515)); walk.yaw = 0.18; walk.pitch = -0.1;
    if (document.activeElement) document.activeElement.blur();
  } else if (!fromWalk || m === 'top') flyTo(viewPose(m));
}
setHint();

/* ---------- walk controls ---------- */
const canvas = renderer.domElement;
let look = null;
canvas.addEventListener('pointerdown', e => { if (mode !== 'walk') return; look = { id: e.pointerId, x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (mode !== 'walk' || !look || e.pointerId !== look.id) return;
  walk.yaw += (e.clientX - look.x) * 0.0045; walk.pitch += (e.clientY - look.y) * 0.0035;
  walk.pitch = Math.max(-1.2, Math.min(1.1, walk.pitch)); look.x = e.clientX; look.y = e.clientY;
});
['pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, e => { if (look && e.pointerId === look.id) look = null; }));
addEventListener('keydown', e => { if (mode === 'walk') { walk.keys[e.code] = true; if (e.code.startsWith('Arrow')) e.preventDefault(); if (e.code === 'Escape') setMode('iso'); } });
addEventListener('keyup', e => { walk.keys[e.code] = false; });
const joy = document.getElementById('joystick'), knob = joy.firstElementChild;
let joyId = null;
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); joyMove(e); e.stopPropagation(); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
['pointerup', 'pointercancel'].forEach(t => joy.addEventListener(t, e => { if (e.pointerId === joyId) { joyId = null; walk.joy.x = walk.joy.y = 0; knob.style.transform = ''; } }));
function joyMove(e){
  const r = joy.getBoundingClientRect(), R = r.width / 2;
  let dx = (e.clientX - r.left - R) / R, dy = (e.clientY - r.top - R) / R;
  const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; }
  walk.joy.x = dx; walk.joy.y = dy;
  knob.style.transform = `translate(${dx * R * 0.55}px, ${dy * R * 0.55}px)`;
}
const RAD = 22;
function blocked(X, Y){
  for (const c of colliders) {
    const qx = Math.max(c[0], Math.min(X, c[2])), qy = Math.max(c[1], Math.min(Y, c[3]));
    if ((X - qx) ** 2 + (Y - qy) ** 2 < RAD * RAD) return true;
  }
  return false;
}
function stepWalk(dt){
  const k = walk.keys;
  let fwd = (k.KeyW || k.ArrowUp ? 1 : 0) - (k.KeyS || k.ArrowDown ? 1 : 0) - walk.joy.y;
  let str = (k.KeyD ? 1 : 0) - (k.KeyA ? 1 : 0) + walk.joy.x;
  walk.yaw += ((k.ArrowLeft ? 1 : 0) - (k.ArrowRight ? 1 : 0)) * dt * 1.6;
  fwd = Math.max(-1, Math.min(1, fwd)); str = Math.max(-1, Math.min(1, str));
  const sp = 140 * dt, sy = Math.sin(walk.yaw), cy = Math.cos(walk.yaw);
  let X = walk.pos.x / S + CX, Y = walk.pos.z / S + CY;
  const dX = (-sy * fwd + cy * str) * sp, dY = (-cy * fwd - sy * str) * sp;
  if (!blocked(X + dX, Y)) X += dX;
  if (!blocked(X, Y + dY)) Y += dY;
  walk.pos.set(wx(X), 1.6, wz(Y));
  camera.position.copy(walk.pos);
  camera.rotation.set(walk.pitch, walk.yaw, 0, 'YXZ');
}

/* ---------- panel collapse (mobile) ---------- */
const panel = document.getElementById('panel');
document.getElementById('collapse').addEventListener('click', e => {
  const open = panel.classList.toggle('open'); e.currentTarget.setAttribute('aria-expanded', String(open));
});

/* ---------- loop ---------- */
controls.addEventListener('change', invalidate);
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let last = performance.now();
function frameLoop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'walk') { stepWalk(dt); dirty = true; }
  else {
    if (tween) {
      const t = tween.ms ? Math.min(1, (now - tween.start) / tween.ms) : 1, e = ease(t);
      camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
      if (t >= 1) tween = null;
      dirty = true;
    }
    controls.update();
  }
  if (dirty) {
    dirty = false;
    renderer.render(scene, camera);
    if (!labelsEl.hidden && mode !== 'walk') placeLabels();
  }
  requestAnimationFrame(frameLoop);
}
loadingEl.remove();
requestAnimationFrame(frameLoop);
})();
